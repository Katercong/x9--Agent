name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgresql:
    name: PostgreSQL full backend suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: x9_test
          POSTGRES_PASSWORD: x9_test_only
        options: >-
          --health-cmd "pg_isready -U x9_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      POSTGRES_TEST_ADMIN_URL: postgresql+psycopg://x9_test:x9_test_only@127.0.0.1:5432/postgres
      SILICONFLOW_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_postgres_tests.py
